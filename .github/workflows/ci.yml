name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Rodar migrations (schema de teste)
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-test.db

      - name: pytest
        run: pytest -v

  frontend:
    name: Frontend (build + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm install

      - name: Type-check + build (Vite)
        run: npm run build

      - name: Testes (Vitest)
        run: npm test -- --run
